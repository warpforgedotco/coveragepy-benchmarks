[project]
name = "coveragepy-benchmarks"
version = "0"
description = "Performance benchmarks for coverage.py"
requires-python = ">=3.10"
license = "Apache-2.0"
# coverage.py itself is deliberately not listed: install the version under test,
# usually `pip install -e path/to/coveragepy`.
dependencies = []

[dependency-groups]
bench = ["pytest", "pytest-benchmark"]
codspeed = ["pytest", "pytest-benchmark", "pytest-codspeed"]
lint = ["mypy", "ruff", "pytest", "pytest-benchmark"]

[tool.pytest.ini_options]
addopts = ["-rfEX", "--strict-markers"]
pythonpath = ["."]
python_classes = ["*Test", "Test*"]
testpaths = ["benchmarks", "tests"]
filterwarnings = [
    # The tokenizer stress corpus deliberately contains invalid escapes.
    "ignore:.*invalid escape sequence:SyntaxWarning",
]
markers = [
    "benchmark: a performance benchmark",
    "slow: a benchmark slow enough to leave out of the default run",
    "real_project: the explicitly prepared, pinned Jinja2 workload",
]

[tool.ruff]
line-length = 100
extend-exclude = ["coveragepy"]

[tool.mypy]
strict = true
files = ["benchmarks", "tests", "conftest.py"]
# Editable installs hide coverage.py from mypy; read it from the submodule.
mypy_path = "coveragepy"

[[tool.mypy.overrides]]
# Use coverage.py's types, but don't report on its own code.
module = ["coverage", "coverage.*"]
follow_imports = "silent"
